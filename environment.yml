name: PianoConcertoAccompaniment

channels:
  - conda-forge

dependencies:
  - python >=3.11,<3.12
  - pip

  # notebooks
  - jupyter
  - jupyterlab >=4.0,<5
  - plotly                  # 04_Analysis.ipynb

  # core deps
  - numpy
  - numba
  - scipy
  - pandas >=2.0,<3
  - matplotlib
  - tqdm

  # audio
  - librosa >=0.10,<0.11
  - soundfile
  - ffmpeg

  # the OLTW baseline runs match/PerformanceMatcher.jar
  - openjdk >=21

  - pip:
      - import-ipynb==0.1.4
      - hmc_mir==0.1.15
      - online-alignment @ git+https://github.com/HMC-MIR/OnlineAlignment@v0.4.1
